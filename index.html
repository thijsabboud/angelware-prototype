<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --page: #f3f1fa; --panel: #ffffff; --ink: #1b1838; --muted: #6b6790; --line: #e4e1f1;
  --head: #2b2470; --head2: #3a3196; --gold: #e7b54a; --gold-ink: #2a1d00; --accent: #4b3fc4;
  --app: #f7f6fc; --wall: #eceaf6; --bin: #ffffff; --bout: #e2ddff; --card: #ffffff; --card2: #f5f3fd;
  --ok: #2f9e6b; --warn: #d9822b; --shadow: 0 1px 1px rgba(27,24,56,.08);
  --notif: rgba(255,255,255,.94);
  --pw: 360px; --ph: min(760px, calc(100vh - 120px));
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0c0a1c; --panel: #15132e; --ink: #ecebff; --muted: #9c98c8; --line: #2a2752;
    --head: #1c1748; --head2: #2a2366; --accent: #a79cff;
    --app: #110f27; --wall: #0e0c22; --bin: #1e1b42; --bout: #3b3394; --card: #1b1940; --card2: #232050;
    --shadow: 0 1px 1px rgba(0,0,0,.3); --notif: rgba(36,33,74,.95);
  }
}
:root[data-theme="dark"] {
  --page: #0c0a1c; --panel: #15132e; --ink: #ecebff; --muted: #9c98c8; --line: #2a2752;
  --head: #1c1748; --head2: #2a2366; --accent: #a79cff;
  --app: #110f27; --wall: #0e0c22; --bin: #1e1b42; --bout: #3b3394; --card: #1b1940; --card2: #232050;
  --shadow: 0 1px 1px rgba(0,0,0,.3); --notif: rgba(36,33,74,.95);
}
html, body { height: 100%; }
body { background: var(--page); color: var(--ink); font-size: 15px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input { font: inherit; color: inherit; }

/* ─── GATE ─────────────────────────────────────────── */
#gate { position: fixed; inset: 0; z-index: 100; background: #0b0920; color: #f2efff; display: flex; align-items: center; justify-content: center; padding: 16px; transition: opacity .5s ease, transform .5s ease; }
#gate.unlock { opacity: 0; transform: scale(1.03); pointer-events: none; }
#gate.gone { display: none; }
.gblob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .22; pointer-events: none; }
.gblob.a { width: 520px; height: 380px; background: #4b3fc4; top: -120px; left: -140px; }
.gblob.b { width: 420px; height: 320px; background: #e7b54a; bottom: -120px; right: -100px; opacity: .14; }
.gcard { position: relative; width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; }
.glogo { width: 72px; height: 72px; filter: drop-shadow(0 0 30px rgba(231,181,74,.25)); }
.gword { font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
.gtag { color: #b9b4e6; font-size: 15px; margin-top: -14px; }
.gproto { font-size: 11px; font-weight: 800; letter-spacing: .14em; color: var(--gold-ink); background: var(--gold); padding: 4px 10px; border-radius: 6px; }
.gform { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.ginput { width: 100%; padding: 14px 16px; font-size: 18px; letter-spacing: .2em; text-align: center; text-transform: uppercase; background: #16133a; border: 1px solid #332d6e; border-radius: 12px; color: #fff; outline: none; }
.ginput::placeholder { letter-spacing: .02em; text-transform: none; color: #6d68a0; font-size: 15px; }
.ginput:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(231,181,74,.15); }
.ginput.err { border-color: #e05a5a; animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.gbtn { padding: 14px; border-radius: 12px; background: var(--gold); color: var(--gold-ink); font-weight: 800; font-size: 16px; }
.gerr { min-height: 18px; font-size: 13px; color: #ff8a8a; }
.gwelcome { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; opacity: 0; pointer-events: none; transition: opacity .3s; }
.gwelcome.show { opacity: 1; }

/* ─── PAGE CHROME ─────────────────────────────────── */
.app-root { min-height: 100%; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
.brand svg { width: 30px; height: 30px; }
.pill-proto { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; background: var(--gold); color: var(--gold-ink); padding: 4px 9px; border-radius: 6px; white-space: nowrap; }
.topbar .sp { flex: 1; }
.iconbtn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--panel); }
.iconbtn svg { width: 18px; height: 18px; }
.main { flex: 1; display: grid; grid-template-columns: 310px 1fr; gap: 24px; padding: 4px 20px 20px; align-items: start; }
.side { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 16px; }
.cap { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.cap .num { font-size: 12px; font-weight: 800; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
.cap h1 { font-size: 21px; line-height: 1.2; margin: 6px 0 8px; letter-spacing: -.01em; }
.cap p { color: var(--muted); line-height: 1.5; font-size: 14px; }
.cap .hint { margin-top: 12px; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--card2); border-radius: 10px; padding: 9px 11px; display: flex; gap: 8px; align-items: flex-start; }
.cap .ctrl { display: flex; gap: 8px; margin-top: 14px; }
.cbtn { flex: 1; padding: 9px; border-radius: 10px; border: 1px solid var(--line); font-weight: 700; font-size: 13.5px; background: var(--panel); }
.cbtn.pri { background: var(--accent); color: #fff; border-color: var(--accent); }
:root[data-theme="dark"] .cbtn.pri { color: #120f2c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cbtn.pri { color: #120f2c; } }
.scenes { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.scn { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--muted); text-align: left; }
.scn .n { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--card2); color: var(--muted); flex: none; }
.scn:hover { background: var(--card2); }
.scn.on { color: var(--ink); background: var(--card2); }
.scn.on .n { background: var(--accent); color: #fff; }
.stage { display: flex; justify-content: center; align-items: flex-start; min-width: 0; }
.mcap { display: none; }

/* phones */
.duo { display: flex; gap: 28px; justify-content: center; }
.pcol { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.plabel { font-size: 13px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.plabel b { color: var(--ink); }
.phonetabs { display: none; }
.phone { width: var(--pw); height: var(--ph); border-radius: 46px; padding: 10px; background: #0a0818; box-shadow: 0 0 0 2px #2c2852, 0 30px 60px -20px rgba(20,16,60,.45); position: relative; }
.phone .screen { border-radius: 37px; }
.phone::before { content: ''; position: absolute; top: 18px; left: 50%; transform: translateX(-50%); width: 96px; height: 26px; border-radius: 20px; background: #0a0818; z-index: 5; }

/* ─── APP SCREEN ──────────────────────────────────── */
.screen { position: relative; height: 100%; display: flex; flex-direction: column; overflow: hidden; background: var(--app); color: var(--ink); }
.sbar { flex: none; height: 46px; padding: 14px 26px 0; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 700; background: var(--head); color: #fff; }
.sbar .ic { display: flex; gap: 5px; align-items: center; }
.sbar svg { height: 12px; }
.ribbon { flex: none; background: var(--gold); color: var(--gold-ink); font-size: 9.5px; font-weight: 800; letter-spacing: .14em; text-align: center; padding: 3px 4px; text-transform: uppercase; }
.ahead { flex: none; background: var(--head); color: #fff; padding: 8px 14px 10px; }
.ahead .row { display: flex; align-items: center; gap: 9px; }
.ahead .word { font-size: 21px; font-weight: 800; letter-spacing: -.02em; flex: 1; }
.ahead svg.logo { width: 28px; height: 28px; }
.ahead .hic { display: flex; gap: 14px; opacity: .9; }
.ahead .hic svg { width: 20px; height: 20px; }
.search { margin-top: 10px; background: rgba(255,255,255,.12); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; color: rgba(255,255,255,.7); display: flex; gap: 8px; align-items: center; }
.search svg { width: 15px; height: 15px; }
.fchips { display: flex; gap: 6px; padding: 10px 12px 4px; overflow-x: auto; scrollbar-width: none; flex: none; }
.fchips span { font-size: 12.5px; font-weight: 700; padding: 5px 11px; border-radius: 999px; background: var(--card2); color: var(--muted); white-space: nowrap; }
.fchips span.on { background: var(--accent); color: #fff; }
.list { flex: 1; overflow-y: auto; }
.row-c { width: 100%; display: flex; gap: 12px; align-items: center; padding: 10px 14px; text-align: left; }
.row-c:hover { background: var(--card2); }
.row-c .mid { flex: 1; min-width: 0; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: -10px; }
.row-c .l1 { display: flex; align-items: center; gap: 6px; }
.row-c .nm { font-weight: 700; font-size: 15.5px; }
.row-c .tm { margin-left: auto; font-size: 11.5px; color: var(--muted); flex: none; }
.row-c .tm.new { color: var(--accent); font-weight: 700; }
.row-c .l2 { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.row-c .pv { flex: 1; font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unr { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--gold); color: var(--gold-ink); font-size: 11.5px; font-weight: 800; display: grid; place-items: center; flex: none; }
.by { font-size: 10.5px; font-weight: 700; color: var(--accent); background: var(--card2); border-radius: 6px; padding: 2px 6px; white-space: nowrap; display: inline-flex; align-items: center; gap: 3px; }
.by svg { width: 10px; height: 10px; }
.av { position: relative; flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 25px; }
.av.sm { width: 36px; height: 36px; font-size: 19px; }
.listfoot { text-align: center; font-size: 11.5px; color: var(--muted); padding: 18px 20px 24px; line-height: 1.5; }
.tabbar { flex: none; display: flex; border-top: 1px solid var(--line); background: var(--app); padding: 6px 0 10px; }
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--muted); }
.tabbar button.on { color: var(--accent); }
.tabbar svg { width: 22px; height: 22px; }

/* chat */
.chead { flex: none; background: var(--head); color: #fff; display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
.chead .back svg { width: 22px; height: 22px; }
.chead .who { flex: 1; min-width: 0; text-align: left; }
.chead .who .nm { font-weight: 700; font-size: 16px; }
.chead .who .sub { font-size: 11.5px; opacity: .78; display: flex; gap: 6px; align-items: center; }
.chead .sub .live { width: 7px; height: 7px; border-radius: 50%; background: #5ee09a; }
.chead .info svg { width: 21px; height: 21px; }
.msgs { flex: 1; overflow-y: auto; padding: 10px 10px 14px; display: flex; flex-direction: column; background-color: var(--wall);
  background-image: radial-gradient(circle at 12px 12px, rgba(120,110,200,.10) 1.4px, transparent 1.6px); background-size: 26px 26px; }
.sysd { align-self: center; font-size: 11.5px; font-weight: 700; color: var(--muted); background: var(--card); border-radius: 8px; padding: 4px 10px; margin: 8px 0 4px; box-shadow: var(--shadow); }
.idchip { align-self: center; max-width: 92%; text-align: center; font-size: 11.5px; line-height: 1.4; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; margin: 4px 0 6px; display: flex; gap: 6px; align-items: center; }
.idchip svg { width: 13px; height: 13px; flex: none; color: var(--accent); }
.b { max-width: 82%; padding: 7px 10px 6px; border-radius: 12px; margin: 2px 0; font-size: 14.5px; line-height: 1.38; box-shadow: var(--shadow); white-space: pre-wrap; word-wrap: break-word; }
.msgs > :first-child { margin-top: auto; }
.fresh { animation: pop .25s ease-out; }
.b.a { align-self: flex-start; background: var(--bin); border-top-left-radius: 4px; }
.b.m { align-self: flex-end; background: var(--bout); border-top-right-radius: 4px; }
.b .t { float: right; font-size: 10.5px; color: var(--muted); margin: 6px 0 -3px 10px; display: inline-flex; gap: 3px; align-items: center; }
.b.m .t svg { width: 14px; height: 10px; color: #4fa3e0; }
.gap { height: 6px; }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
.typing { align-self: flex-start; background: var(--bin); border-radius: 12px; border-top-left-radius: 4px; padding: 12px 15px 10px; margin: 2px 0; box-shadow: var(--shadow); }
.typing .th { display: block; width: 26px; height: 9px; border: 2.5px solid var(--gold); border-radius: 50%; opacity: .55; animation: halo 1.3s ease-in-out infinite; }
@keyframes halo { 50% { opacity: 1; transform: translateY(-3px); box-shadow: 0 0 9px var(--gold); } }
.chips { flex: none; display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 10px 2px; background: var(--wall); justify-content: flex-end; }
.chip { border: 1.5px solid var(--accent); color: var(--accent); background: var(--card); border-radius: 999px; padding: 7px 13px; font-weight: 700; font-size: 13.5px; animation: pop .25s ease-out; }
.chip:hover { background: var(--accent); color: #fff; }
.inbar { flex: none; display: flex; gap: 8px; align-items: center; padding: 8px 8px 10px; background: var(--wall); }
.inbar .ib { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; height: 42px; border-radius: 22px; background: var(--card); color: var(--ink); font-size: 13.5px; font-weight: 700; box-shadow: var(--shadow); }
.inbar .ib.talk { background: var(--accent); color: #fff; }
.inbar .ib svg { width: 18px; height: 18px; flex: none; }
.inbar .ib.hint { animation: ring 1.6s infinite; }
@keyframes ring { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } to { box-shadow: 0 0 0 9px transparent; } }
.inbar .ib.field, .inbar .ib.live { height: auto; min-height: 42px; padding: 10px 16px; justify-content: flex-start; text-align: left; font-weight: 600; line-height: 1.35; }
.inbar .ib.live svg { animation: pulse 1s infinite; }
.inbar .caret { display: inline-block; width: 2px; height: 1.05em; background: var(--accent); vertical-align: -2px; margin-left: 1px; animation: pulse 1s steps(1) infinite; }

/* cards */
.cw { align-self: flex-start; width: 90%; margin: 3px 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.ch { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; color: var(--muted); padding: 7px 12px; background: var(--card2); letter-spacing: .02em; }
.ch svg { width: 12px; height: 12px; color: var(--accent); }
.ch .r { margin-left: auto; font-weight: 600; }
.cb { padding: 12px; }
.ct { font-weight: 800; font-size: 16px; letter-spacing: -.01em; }
.cs { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.cbtns { display: flex; gap: 8px; margin-top: 12px; }
.btn { flex: 1; padding: 10px 12px; border-radius: 11px; font-weight: 800; font-size: 13.5px; background: var(--accent); color: #fff; text-align: center; }
.btn.sec { background: var(--card2); color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
:root[data-theme="dark"] .btn:not(.sec) { color: #120f2c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn:not(.sec) { color: #120f2c; } }
.done-badge { display: inline-flex; gap: 6px; align-items: center; font-weight: 800; color: var(--ok); font-size: 13.5px; }
.done-badge svg { width: 16px; height: 16px; }

/* workout */
.ex { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); }
.ex:first-of-type { border-top: none; }
.ex .en { flex: 1; min-width: 0; }
.ex .en b { font-size: 13.5px; display: block; }
.ex .en span { font-size: 11.5px; color: var(--muted); }
.sets { display: flex; gap: 4px; }
.setd { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 10px; font-weight: 800; color: var(--muted); }
.setd.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.wt { display: flex; align-items: center; gap: 2px; background: var(--card2); border-radius: 9px; padding: 2px; }
.wt button { width: 22px; height: 24px; border-radius: 7px; font-weight: 800; font-size: 15px; line-height: 1; color: var(--accent); }
.wt span { min-width: 44px; text-align: center; font-size: 12.5px; font-weight: 800; font-variant-numeric: tabular-nums; }
.wsum { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 8px; }
.logged { display: flex; align-items: center; gap: 10px; }
.logged .ok { width: 34px; height: 34px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; flex: none; }
.logged .ok svg { width: 18px; height: 18px; }

/* chart */
.chart { width: 100%; height: auto; display: block; margin-top: 8px; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.chart .ar { fill: var(--accent); opacity: .12; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart text { font-size: 10px; fill: var(--muted); font-family: inherit; font-weight: 600; }
.chart .pt { fill: var(--card); stroke: var(--accent); stroke-width: 2; }
.chart .np { fill: var(--gold); stroke: var(--card); stroke-width: 2.5; animation: grow .6s .5s both cubic-bezier(.3,1.6,.5,1); transform-box: fill-box; transform-origin: center; }
.chart .nl { stroke: var(--gold); stroke-width: 2.5; stroke-dasharray: 4 4; fill: none; stroke-dashoffset: 0; animation: draw .6s both; }
.chart .nlab { fill: var(--ink); font-weight: 800; font-size: 11px; animation: fade .4s .9s both; }
@keyframes grow { from { transform: scale(0); } }
@keyframes draw { from { opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.stat { background: var(--card2); border-radius: 10px; padding: 8px; }
.stat b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 10.5px; color: var(--muted); font-weight: 600; }

/* session */
.sess { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
.playb { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.playb svg { width: 18px; height: 18px; }
.prog { flex: 1; }
.bar { height: 6px; border-radius: 3px; background: var(--card2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; border-radius: 3px; }
.ptime { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 5px; font-variant-numeric: tabular-nums; }
.wave { display: flex; gap: 2px; align-items: center; height: 26px; margin-bottom: 6px; }
.wave i { flex: 1; background: var(--accent); opacity: .25; border-radius: 2px; }
.wave i.on { opacity: .9; }

/* permission + health */
.pcard { border-color: var(--gold); }
.pcard .ch { background: var(--gold); color: var(--gold-ink); }
.pcard .ch svg { color: var(--gold-ink); }
.prows { margin-top: 6px; }
.pcard .rrow { padding: 9px 0; font-size: 13.5px; }
.pcard .rrow:first-child { border-top: none; }
.pcard .rrow:disabled { opacity: .7; cursor: default; }
.done-badge.muted { color: var(--muted); }
.hrl { width: 100%; height: 46px; display: block; margin-top: 10px; }
.hrl path { fill: none; stroke: #d9546e; stroke-width: 2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }

/* orders, payment, agents talking */
.ord { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.ord:first-of-type { border-top: none; margin-top: 4px; }
.oe { width: 38px; height: 38px; border-radius: 10px; background: var(--card2); display: grid; place-items: center; font-size: 20px; flex: none; }
.om { flex: 1; min-width: 0; }
.on1 { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
.on1 span { font-weight: 700; font-variant-numeric: tabular-nums; }
.os { font-size: 12px; color: var(--muted); margin-top: 2px; }
.otrack { display: flex; gap: 4px; margin-top: 7px; }
.otrack i { flex: 1; height: 5px; border-radius: 3px; background: var(--card2); }
.otrack i.on { background: var(--ok); }
.otrack i.now { background: var(--gold); animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .45; } }
.olink { margin-top: 8px; font-size: 12.5px; font-weight: 800; color: var(--accent); background: var(--card2); border-radius: 8px; padding: 6px 10px; }
.odone { margin-top: 8px; font-size: 12.5px; font-weight: 800; color: var(--ok); display: flex; gap: 5px; align-items: center; }
.odone svg { width: 14px; height: 14px; }
.quote { margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--gold); background: var(--card2); border-radius: 0 10px 10px 0; font-size: 13.5px; line-height: 1.45; font-weight: 600; }
.gets { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.gets > div { display: flex; gap: 8px; align-items: center; }
.gets span { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 800; font-size: 12px; }
.gets .y { background: var(--ok); color: #fff; } .gets .y svg { width: 11px; height: 11px; }
.gets .n { background: var(--card2); color: var(--muted); }

/* digest */
.row-c.dg { background: color-mix(in srgb, var(--gold) 14%, transparent); }
.dgav { background: none !important; }
.dlogo { width: 48px; height: 48px; }
.drow .av { width: 36px; height: 36px; font-size: 18px; }
.drow > svg { width: 16px; height: 16px; transform: rotate(180deg); color: var(--muted); flex: none; }
.drow .rl b { font-size: 14px; }
.dnote { text-align: center; font-size: 12px; color: var(--muted); padding: 14px; }

/* rules: log, pause */
.lrow { display: flex; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 13px; line-height: 1.4; }
.rcard h3 + .lrow { border-top: none; }
.lt { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; flex: none; width: 40px; }
.rrow.pause { color: #c2410c; font-weight: 700; }
.rrow.pause > svg { width: 18px; height: 18px; flex: none; }
.rrow.pause.on { color: var(--ok); }
.pz { font-size: 10.5px; font-weight: 800; background: #c2410c; color: #fff; border-radius: 6px; padding: 2px 6px; vertical-align: 2px; }

/* builder: tabs, privacy, analytics */
.btabs { display: flex; gap: 4px; padding: 10px 16px 0; border-bottom: 1px solid var(--line); background: var(--panel); overflow-x: auto; scrollbar-width: none; }
.btabs button { padding: 9px 12px; font-size: 13.5px; font-weight: 700; color: var(--muted); border-bottom: 2.5px solid transparent; white-space: nowrap; }
.btabs button.on { color: var(--ink); border-color: var(--accent); }
.ptable { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.pr { display: grid; grid-template-columns: 1fr 72px 64px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 13.5px; gap: 6px; }
.pr.ph { border-top: none; background: var(--card2); font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.pr.ph span + span { text-align: center; }
.pk small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.pc { justify-self: center; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--card2); color: var(--muted); font-weight: 800; font-size: 15px; }
.pc svg { width: 15px; height: 15px; }
.pc.on { background: var(--ok); color: #fff; }
.pc.fixed { opacity: .55; }
.pr.off .pk { color: var(--muted); }
.pc:disabled { background: var(--card2); color: var(--muted); cursor: not-allowed; }
.bhelp { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.4; }
.addrole { align-self: flex-start; font-size: 13px; font-weight: 700; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--card2); border-radius: 12px; padding: 10px 12px; }
.kpi b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--muted); font-weight: 600; }
.kpi small { display: block; font-size: 11px; color: var(--muted); font-weight: 700; margin-top: 2px; }
.kpi small.up { color: var(--ok); }
.sax { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 4px; }
.bh { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px; }
.sbars { width: 100%; height: auto; display: block; }
.sbars rect { fill: var(--accent); opacity: .35; }
.sbars rect.last { opacity: 1; }
.sbars text { font-size: 10px; fill: var(--muted); font-weight: 600; font-family: inherit; }
.hb { display: grid; grid-template-columns: 130px 1fr 40px; gap: 10px; align-items: center; font-size: 12.5px; padding: 4px 0; }
.hb b { text-align: right; font-variant-numeric: tabular-nums; }
.hb code, .fun code { font-size: 12px; }
.hbar { height: 8px; border-radius: 4px; background: var(--card2); overflow: hidden; display: block; }
.hbar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.fun { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; }
.fun b { font-variant-numeric: tabular-nums; }
.fun .hbar { grid-column: 1 / -1; }

/* summary (coach) */
.kv { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-top: 1px solid var(--line); }
.kv:first-of-type { border-top: none; }
.kv span { color: var(--muted); }
.kv b { font-weight: 700; text-align: right; }
.up { color: var(--ok); }

/* patient */
.days { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; margin-top: 10px; }
.day { flex: 1; min-width: 40px; padding: 6px 2px; border-radius: 10px; background: var(--card2); text-align: center; font-size: 10.5px; font-weight: 700; color: var(--muted); }
.day b { display: block; font-size: 14px; color: var(--ink); }
.day.on { background: var(--accent); color: rgba(255,255,255,.85); }
.day.on b { color: #fff; }
.meter { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12.5px; }
.meter .lb { width: 112px; color: var(--muted); font-weight: 600; flex: none; }
.meter .sg { display: flex; gap: 3px; flex: 1; }
.meter .sg i { flex: 1; height: 8px; border-radius: 4px; background: var(--card2); }
.meter .sg i.on { background: #4f9cc4; }
.meter .vl { width: 56px; text-align: right; font-weight: 700; flex: none; }
.mile { margin-top: 12px; background: var(--card2); border-radius: 12px; padding: 10px 11px; font-size: 13px; line-height: 1.45; }
.mile .lbl { font-size: 10.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }
.foot { font-size: 11.5px; color: var(--muted); margin-top: 10px; line-height: 1.45; display: flex; gap: 6px; }
.foot svg { width: 13px; height: 13px; flex: none; margin-top: 1px; }

/* chores */
.kids { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.kid { background: var(--card2); border-radius: 12px; padding: 9px; }
.kid .kh { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
.kid .kh b { font-size: 14px; }
.kid .kh span { font-size: 11px; color: var(--muted); display: block; font-weight: 600; }
.ring { width: 32px; height: 32px; flex: none; }
.ring .bg { stroke: var(--line); } .ring .fg { stroke: var(--ok); transition: stroke-dashoffset .5s; }
.todo { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; line-height: 1.3; padding: 4px 0; width: 100%; text-align: left; }
.todo .bx { width: 16px; height: 16px; border-radius: 5px; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; margin-top: -1px; }
.todo.on .bx { background: var(--ok); border-color: var(--ok); color: #fff; }
.todo.on .bx svg { width: 10px; height: 10px; }
.todo.on .tx { color: var(--muted); text-decoration: line-through; }

/* charge */
.chg { display: flex; gap: 14px; align-items: center; margin-top: 8px; }
.cring { width: 92px; height: 92px; flex: none; position: relative; }
.cring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.cring .bg { stroke: var(--card2); } .cring .fg { stroke: var(--ok); transition: stroke-dashoffset .3s linear; }
.cring .cpct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; }
.cring .cpct small { display: block; font-size: 10px; color: var(--muted); font-weight: 700; text-align: center; margin-top: -4px; }
.cgrid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.cgrid div span { display: block; font-size: 10.5px; color: var(--muted); font-weight: 600; }
.cgrid div b { font-size: 14px; font-variant-numeric: tabular-nums; }
.spot { margin-top: 12px; display: flex; align-items: center; gap: 10px; background: var(--card2); border-radius: 12px; padding: 9px 11px; font-size: 12.5px; }
.spot .pn { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 16px; flex: none; }

/* cycle */
.cyc { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
.cyc svg { width: 84px; height: 84px; flex: none; }
.cyc .ph b { font-size: 15px; display: block; }
.cyc .ph span { font-size: 12.5px; color: var(--muted); line-height: 1.45; display: block; margin-top: 2px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.tags span { font-size: 11.5px; font-weight: 700; background: var(--card2); border-radius: 999px; padding: 4px 9px; }

/* notification */
.notif { position: absolute; left: 8px; right: 8px; top: 70px; z-index: 10; background: var(--notif); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 20px; padding: 11px 12px; display: flex; gap: 10px; box-shadow: 0 12px 30px -8px rgba(15,10,50,.45); text-align: left; animation: drop .5s cubic-bezier(.2,1.2,.4,1); }
.notif .nlogo { width: 38px; height: 38px; flex: none; }
.notif .nb { flex: 1; min-width: 0; }
.notif .n1 { display: flex; font-size: 11.5px; color: var(--muted); font-weight: 700; }
.notif .n1 span { margin-left: auto; font-weight: 600; }
.notif .n2 { font-size: 14px; font-weight: 800; margin-top: 1px; display: flex; gap: 6px; align-items: center; }
.notif .n3 { font-size: 13.5px; line-height: 1.35; margin-top: 1px; }
.notif::after { content: 'Tap to open'; position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 800; color: #fff; background: var(--accent); padding: 3px 9px; border-radius: 999px; animation: pulse 1.6s infinite; }
@keyframes drop { from { transform: translateY(-120px); opacity: 0; } }
@keyframes pulse { 50% { opacity: .55; } }
.paysheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--panel); border-radius: 22px 22px 0 0; padding: 14px 18px 22px; box-shadow: 0 -10px 30px -10px rgba(15,10,50,.4); animation: rise .35s cubic-bezier(.2,1,.3,1); }
.paysheet .psh { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.paysheet .psh svg { width: 22px; height: 22px; }
.paysheet .px { margin-left: auto; color: var(--accent); font-weight: 700; font-size: 14px; }
.paysheet .prw { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 9px 0; border-top: 1px solid var(--line); }
.paysheet .prw:first-of-type { margin-top: 10px; }
.paysheet .prw span { color: var(--muted); }
.paysheet .prw b { text-align: right; font-weight: 700; }
.paysheet .pamt { font-size: 30px; font-weight: 800; text-align: center; margin: 12px 0; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.paysheet .paybtn { width: 100%; padding: 13px; border-radius: 13px; background: #111; color: #fff; font-weight: 800; font-size: 15px; }
:root[data-theme="dark"] .paysheet .paybtn { background: #fff; color: #111; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .paysheet .paybtn { background: #fff; color: #111; } }
.paysheet .pdone { display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 800; color: var(--ok); }
.paysheet .pdone span { width: 46px; height: 46px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
.paysheet .pdone svg { width: 24px; height: 24px; }
.paysheet .pnote { font-size: 11.5px; color: var(--muted); text-align: center; margin-top: 10px; line-height: 1.4; }
@keyframes rise { from { transform: translateY(100%); } to { transform: none; } }
@keyframes pop { from { transform: scale(.4); } to { transform: none; } }
.roster .rw { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
.roster .rw:first-of-type { border-top: none; }
.roster .rd { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
.roster .rd.warn { background: var(--warn); }
.roster .rm { flex: 1; min-width: 0; }
.roster .rm b { display: block; font-size: 13.5px; }
.roster .rm span { color: var(--muted); font-size: 12px; }
.roster .rs { font-weight: 800; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.todo .src { display: block; font-size: 10.5px; color: var(--ok); font-weight: 700; text-decoration: none; margin-top: 1px; }
.dim { position: absolute; inset: 0; background: rgba(10,8,30,.25); z-index: 9; animation: fade .4s; }

/* rules */
.rhead { flex: none; background: var(--head); color: #fff; padding: 10px 12px 12px; }
.rhead .row { display: flex; align-items: center; gap: 8px; }
.rhead h2 { font-size: 19px; font-weight: 800; flex: 1; }
.rhead .back svg { width: 22px; height: 22px; }
.rhead p { font-size: 12px; opacity: .75; margin-top: 4px; }
.agpick { display: flex; gap: 8px; overflow-x: auto; padding: 12px 12px 4px; flex: none; scrollbar-width: none; }
.agp { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--muted); flex: none; width: 54px; padding-top: 4px; }
.agp .av { width: 42px; height: 42px; font-size: 21px; opacity: .55; }
.agp.on { color: var(--ink); }
.agp.on .av { opacity: 1; box-shadow: 0 0 0 2.5px var(--app), 0 0 0 4.5px var(--accent); }
.rbody { flex: 1; overflow-y: auto; padding: 6px 12px 20px; }
.rcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-top: 10px; overflow: hidden; }
.rcard h3 { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; padding: 10px 12px 2px; }
.rrow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); width: 100%; text-align: left; font-size: 14px; }
.rcard h3 + .rrow { border-top: none; }
.rrow .rl { flex: 1; min-width: 0; }
.rrow .rl small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; line-height: 1.35; }
.tg { width: 44px; height: 26px; border-radius: 13px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.tg::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s; }
.tg.on { background: var(--ok); }
.tg.on::after { transform: translateX(18px); }
.stp { display: flex; align-items: center; gap: 6px; flex: none; }
.stp button { width: 28px; height: 28px; border-radius: 8px; background: var(--card2); font-weight: 800; color: var(--accent); font-size: 16px; }
.stp b { min-width: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.agcard { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-top: 8px; }
.agcard .nm { font-weight: 800; font-size: 16px; }
.agcard small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 3px; line-height: 1.4; }
.sharetxt { font-size: 13px; padding: 10px 12px; line-height: 1.45; display: flex; gap: 8px; }
.sharetxt svg { width: 15px; height: 15px; flex: none; color: var(--accent); margin-top: 1px; }

/* ─── BUILDER (scene 8) ───────────────────────────── */
.browser { width: min(960px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(20,16,60,.35); }
.bbar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--card2); border-bottom: 1px solid var(--line); }
.dots { display: flex; gap: 6px; } .dots i { width: 11px; height: 11px; border-radius: 50%; background: #e8605a; } .dots i:nth-child(2) { background: #e9b13d; } .dots i:nth-child(3) { background: #5cc157; }
.burl { flex: 1; background: var(--panel); border-radius: 8px; padding: 6px 12px; font-size: 12.5px; color: var(--muted); font-weight: 600; text-align: center; }
.bribbon { background: var(--gold); color: var(--gold-ink); font-size: 10px; font-weight: 800; letter-spacing: .14em; text-align: center; padding: 3px; text-transform: uppercase; }
.bwrap { display: grid; grid-template-columns: 1fr 300px; }
.bform { padding: 20px 22px 24px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; }
.bform h2 { font-size: 20px; letter-spacing: -.01em; }
.bform h2 + p { color: var(--muted); font-size: 13.5px; margin-top: -10px; }
.fld2 > label:not(.opt) { display: block; font-size: 12px; font-weight: 800; color: var(--muted); margin-bottom: 6px; letter-spacing: .02em; }
.fld2 input[type=text] { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--app); font-size: 14px; outline: none; }
.fld2 input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(75,63,196,.12); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.emo { display: flex; gap: 6px; flex-wrap: wrap; }
.emo button { width: 38px; height: 38px; border-radius: 10px; background: var(--card2); font-size: 20px; border: 2px solid transparent; }
.emo button.on { border-color: var(--accent); }
.cols { display: flex; gap: 6px; margin-top: 8px; }
.cols button { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; }
.cols button.on { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
.urlrow { display: flex; gap: 8px; }
.urlrow input { flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, monospace !important; font-size: 13px !important; }
.urlrow .btn { flex: none; padding: 10px 14px; }
.conn { margin-top: 8px; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.conn .okc { color: var(--ok); font-weight: 800; display: inline-flex; gap: 5px; align-items: center; }
.conn .okc svg { width: 14px; height: 14px; }
.conn code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; background: var(--card2); padding: 2px 6px; border-radius: 5px; color: var(--ink); }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; cursor: pointer; font-size: 13.5px; }
.opt + .opt { margin-top: 6px; }
.opt input { margin-top: 3px; accent-color: var(--accent); }
.opt small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.opt.on { border-color: var(--accent); background: var(--card2); }
.price { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--card2); }
.price .amt { white-space: nowrap; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.price .amt small { font-size: 13px; font-weight: 700; color: var(--muted); }
.price p { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.pubrow { display: flex; gap: 10px; align-items: center; }
.pubrow .btn { flex: none; padding: 12px 22px; font-size: 15px; }
.pubrow span { font-size: 12px; color: var(--muted); }
.bprev { padding: 20px 18px; background: var(--app); display: flex; flex-direction: column; gap: 12px; }
.bprev h4 { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.mini { background: var(--app); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.mini .row-c { pointer-events: none; }
.mini .row-c .mid { border-bottom: none; }
.mini .msgs { padding: 10px; min-height: 120px; }
.success { border-radius: 14px; padding: 16px; background: color-mix(in srgb, var(--ok) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); }
.success b { font-size: 16px; display: flex; gap: 8px; align-items: center; }
.success b svg { width: 20px; height: 20px; color: var(--ok); }
.success p { font-size: 13.5px; color: var(--muted); margin-top: 6px; line-height: 1.5; }

/* ─── RESPONSIVE ──────────────────────────────────── */
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; flex-direction: column; min-width: 0; }
  .scenes { flex-direction: row; overflow-x: auto; scrollbar-width: none; }
  .scn { white-space: nowrap; }
  .side { order: 0; } .stage { order: 1; }
}
@media (max-width: 860px) {
  .bwrap { grid-template-columns: 1fr; }
  .bform { border-right: none; border-bottom: 1px solid var(--line); }
}
@media (max-width: 760px) {
  body { font-size: 15px; }
  .app-root { height: 100dvh; min-height: 0; overflow: hidden; }
  .topbar { padding: 8px 12px; gap: 8px; }
  .brand { font-size: 16px; } .brand svg { width: 26px; height: 26px; }
  .pill-proto { display: none; }
  .main { padding: 0; gap: 0; display: flex; flex-direction: column; align-items: stretch; flex: 1; min-height: 0; }
  .side { gap: 0; }
  .cap { display: none; }
  .scenes { border-radius: 0; border-left: 0; border-right: 0; padding: 6px 8px; gap: 4px; }
  .scn { padding: 6px 9px; font-size: 13px; gap: 6px; }
  .scn .n { width: 20px; height: 20px; font-size: 11px; }
  .mcap { display: flex; gap: 8px; align-items: center; padding: 7px 12px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--panel); }
  .mcap b { color: var(--ink); }
  .mcap .mc { flex: 1; min-width: 0; line-height: 1.35; }
  .mcap button { flex: none; font-size: 12px; font-weight: 800; color: var(--accent); padding: 4px 6px; }
  .stage { flex: 1; min-height: 0; display: block; overflow: hidden; }
  .stage.scroll { overflow-y: auto; }
  .duo { display: flex; flex-direction: column; height: 100%; gap: 0; }
  .phonetabs { display: flex; flex: none; background: var(--panel); border-bottom: 1px solid var(--line); }
  .phonetabs button { flex: 1; padding: 8px; font-size: 13px; font-weight: 700; color: var(--muted); border-bottom: 2.5px solid transparent; position: relative; }
  .phonetabs button.on { color: var(--ink); border-color: var(--accent); }
  .phonetabs button.dot::after { content: ''; position: absolute; top: 9px; margin-left: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
  .pcol { height: 100%; gap: 0; display: none; }
  .pcol.on { display: flex; flex: 1; min-height: 0; }
  .plabel { display: none; }
  .phone { width: 100%; height: 100%; border-radius: 0; padding: 0; background: none; box-shadow: none; }
  .phone::before { display: none; }
  .phone .screen { border-radius: 0; }
  .sbar { display: none; }
  .notif { top: 28px; }
  .browser { border-radius: 0; border: 0; overflow: visible; }
  .bribbon { position: sticky; top: 0; z-index: 3; }
  .bbar { display: none; }
  .bform { padding: 16px; }
  .two { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .hb { grid-template-columns: 110px 1fr 34px; }
  .pr { grid-template-columns: 1fr 60px 52px; }
}
</style>

function push(d, id, msg) {
  d.chats[id].push(msg);
  if (msg.t) d.listTime[id] = msg.t;
  d.order = [id, ...d.order.filter(x => x !== id)];
  if (!(d.view === 'chat' && d.chat === id)) d.unread[id] = (d.unread[id] || 0) + 1;
  if (S.scene === 4 && window.matchMedia('(max-width: 760px)').matches && S.tab !== d.id) markTab(d.id);
  render(d, { bottom: true });
}
async function say(d, id, msg, ms = 1000) {
  d.typing[id] = true; render(d, { bottom: true });
  const ok = await wait(ms);
  if (!ok) return false;
  d.typing[id] = false;
  push(d, id, msg);
  return true;
}
function me(d, id, text, t) { d.chips[id] = null; push(d, id, m(text, t || d.time)); }
function openChat(d, id) {
  d.notif = null; d.view = 'chat'; d.chat = id; d.unread[id] = 0;
  render(d, { bottom: true });
}

async function ottoBuy(d, item, amt, then) {

    sp.used += amt;
    if (!await say(d, 'otto', card({ type: 'paid', item, amt, per: sp.per }, d.time), 1000)) return;

    await say(d, 'otto', card({ type: 'approve', item, amt, state: null }, d.time), 700);

const cardHead = (id, label, right) => `<div class="ch">${I.screen}<span>${label} · ${AG[id].by}</span>${right ? `<span class="r">${right}</span>` : ''}</div>`;
const fmtKg = w => (w % 1 ? w.toFixed(1) : w) + ' kg';

      <div class="wt"><button data-act="wt" data-ei="${ei}" data-v="-2.5" aria-label="Less weight">−</button><span>${fmtKg(e.w)}</span><button data-act="wt" data-ei="${ei}" data-v="2.5" aria-label="More weight">+</button></div>
      <div class="sets">${e.sets.map((s, si) => `<button class="setd${s ? ' on' : ''}" data-act="set" data-ei="${ei}" data-si="${si}" aria-label="Set ${si + 1}">${s ? '✓' : si + 1}</button>`).join('')}</div></div>`).join('');
    const n = setsDone(c);

      <div class="ct">${c.title}</div><div class="cs">${c.plan} · tap a set when it’s done</div>

  },
  progress(d, cid, mi, c) {
    const pts = c.series, W = 280, H = 118, px = 26, py = 14;
    const lo = Math.min(...pts) - 2.5, hi = Math.max(...pts) + 2.5;
    const X = i => px + i * (W - px - 14) / (pts.length - 1);
    const Y = v => py + (hi - v) * (H - py - 22) / (hi - lo);
    const old = pts.slice(0, -1);
    const path = old.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
    const area = path + `L${X(old.length - 1)},${H - 22}L${X(0)},${H - 22}Z`;
    const li = pts.length - 1;
    const grid = [lo + 2.5, (lo + hi) / 2, hi - 2.5].map(v => `<line class="gl" x1="${px}" x2="${W - 8}" y1="${Y(v)}" y2="${Y(v)}"/><text x="0" y="${Y(v) + 3}">${Math.round(v)}</text>`).join('');
    const labels = pts.map((v, i) => `<text x="${X(i) - 8}" y="${H - 6}">${i === li ? 'Now' : 'W' + (i + 1)}</text>`).join('');
    return `<div class="card">${cardHead(cid, 'Interactive screen', 'live')}<div class="cb">
      <div class="ct">Bench press, top set</div><div class="cs">Last 6 weeks · kg</div>
      <svg class="chart" viewBox="0 0 ${W} ${H}">${grid}<path class="ar" d="${area}"/><path class="ln" d="${path}"/>
        ${old.map((v, i) => `<circle class="pt" cx="${X(i)}" cy="${Y(v)}" r="3.5"/>`).join('')}
        <path class="nl" d="M${X(li - 1)},${Y(pts[li - 1])}L${X(li)},${Y(pts[li])}"/>
        <circle class="np" cx="${X(li)}" cy="${Y(pts[li])}" r="5.5"/>
        <text class="nlab" x="${X(li) - 22}" y="${Y(pts[li]) - 10}">${pts[li]}</text>${labels}</svg>
      <div class="stats"><div class="stat"><b>${c.sets}/12</b><span>sets</span></div><div class="stat"><b>${(c.vol / 1000).toFixed(1)}t</b><span>volume</span></div><div class="stat"><b>3</b><span>sessions this week</span></div></div></div></div>`;
  },
  session(d, cid, mi, c) {
    const bars = Array.from({ length: 34 }, (_, i) => 6 + Math.round(18 * Math.abs(Math.sin(i * 1.7) * Math.cos(i * .43))));

      <div class="ptime"><span id="pt-${d.id}-${mi}">${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}</span><span>${c.mins}:00</span></div></div></div>
      ${c.done ? `<div class="cbtns"><span class="done-badge">${I.check} Completed</span></div>` : ''}</div></div>`;
  },
  perm(d, cid, mi, c) {
    const on = c.items.filter(x => x[1]);

    return `<div class="card pcard"><div class="ch">${I.shield}<span>Angelware · permission</span></div><div class="cb">
      <div class="ct">Share health data with ${AG[cid].name}?</div><div class="cs">Pick what to share.</div>

  health(d, cid, mi, c) {
    const W = 280, H = 46;

    hr.push(112, 104, 97);

    const path = hr.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
    return `<div class="card"><div class="ch">${I.heart}<span>Health data · from your wearable</span></div><div class="cb">
      <div class="ct">Today’s session</div><div class="cs">17:48 to 18:37 · strength training</div>

    approve() { msgOf(t, d).c.approved = true; render(d); },
    nudge() { msgOf(t, d).c.nudged = true; render(d); say(d, 'kodiak', a('Sent Jonas a short check-in. I’ll tell you what he says.', '18:56'), 900); },
    adjust() { msgOf(t, d).c.approved = true; render(d); },
    day() { msgOf(t, d).c.day = +t.dataset.i; render(d); },
    chore() {
      const c = msgOf(t, d).c, k = c.kids[+t.dataset.k], it = k.items[+t.dataset.i];
      it.d ^= 1; render(d);
      if (it.d && k.items.every(i => i.d)) say(d, 'pip', a(`${k.n} is done for today ⭐ I’ll tell ${k.n === 'Mila' ? 'her' : 'him'}.`, d.time), 900);
    },
    remind() {
      const c = msgOf(t, d).c; c.reminded = true;
      me(d, 'pip', 'Remind Sem about the piano.');
      (async () => {
        if (!await say(d, 'pip', a('Sent to Sem: “Piano first, Lego later. 15 minutes. 🎹”', d.time), 1000)) return;
        if (!await wait(1500)) return;
        if (!await say(d, 'pip', a('Sem replied: “ok 🙄”. Piano has started. I can hear it from here.', '16:14'), 1100)) return;
        const p = c.kids[1].items[2]; p.d = 1; render(d, { bottom: true });
      })();
    },
    topup() {
      const c = msgOf(t, d).c, mi = +t.closest('.cw').dataset.mi; c.state = 'topping'; render(d);
      const g = S.gen, C = 2 * Math.PI * 40;
      const tick = () => {
        if (g !== S.gen) return;
        c.pct = Math.min(90, c.pct + .25); c.kwh = 32.4 + (c.pct - 80) * .41; c.cost = 11.02 + (c.pct - 80) * .139;
        const r = document.getElementById(`cr-${d.id}-${mi}`);
        if (r) { r.setAttribute('stroke-dashoffset', C * (1 - c.pct / 100)); document.getElementById(`cp-${d.id}-${mi}`).textContent = Math.round(c.pct); document.getElementById(`ck-${d.id}-${mi}`).textContent = c.kwh.toFixed(1) + ' kWh'; document.getElementById(`cc-${d.id}-${mi}`).textContent = '€' + c.cost.toFixed(2); }
        if (c.pct >= 90) { c.state = 'charged'; c.mins += 14; render(d); say(d, 'spark', a(`90%. Another 4.1 kWh, €1.39. Total €${c.cost.toFixed(2)}.`, '17:56'), 800); return; }
        setTimeout(tick, 70);
      };
      setTimeout(tick, 70);
    },
    leave() {
      const c = msgOf(t, d).c;
      d.pay = { agent: 'spark', item: 'Charging, Harbour Garage', amt: Math.round(c.cost * 100) / 100, then: () => {
        c.state = 'closed'; render(d, { bottom: true });
        say(d, 'spark', a(`Paid, €${c.cost.toFixed(2)}. The gate opens as you drive up. Drive safe.`, d.time), 900);
      } };
      render(d);
    },
    payok() {
      const p = d.pay; p.done = true; render(d);
      const g = S.gen;
      setTimeout(() => { if (g !== S.gen) return; d.pay = null; render(d); p.then(); }, 1000);
    },
    paycancel() { const p = d.pay; d.pay = null; render(d); if (p.cancel) p.cancel(); },
    ragent() { d.rulesAgent = t.dataset.id; render(d, { top: true }); },
    rt() { const r = S.rules[d.rulesAgent]; r[t.dataset.k] = !r[t.dataset.k]; render(d); },
    rs() { const r = S.rules[d.rulesAgent]; r.perDay = Math.max(0, Math.min(9, r.perDay + +t.dataset.v)); render(d); },
    rsee() { const r = S.rules[d.rulesAgent]; const s = r.see[+t.dataset.i]; s[1] = s[1] ? 0 : 1; render(d); },
    bemo() { S.b.emoji = t.dataset.v; renderStage(); },
    bcol() { S.b.color = t.dataset.v; renderStage(); },
    bconn() { S.b.conn = 1; renderStage(); const g = S.gen; setTimeout(() => { if (g === S.gen) { S.b.conn = 2; renderStage(); } }, 900); },
    publish() { S.b.published = true; renderStage(); },
    unpublish() { S.b.published = false; renderStage(); },
  };
  if (ACT[act]) { e.preventDefault(); ACT[act](); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.in;
  if (!k || !S.b) return;
  if (k === 'who') { S.b.who = e.target.value; renderStage(); return; }
  if (k === 'first') { S.b.first = e.target.checked; renderStage(); return; }
  if (k === 'url') { S.b.url = e.target.value; return; }
  S.b[k] = e.target.value;
  const p = document.getElementById('bprev'); if (p) p.innerHTML = builderPreview();
});
document.addEventListener('keydown', e => {
  if (document.getElementById('gate').classList.contains('gone') === false) return;
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowRight' && S.scene < SCENES.length) setScene(S.scene + 1);
  if (e.key === 'ArrowLeft' && S.scene > 1) setScene(S.scene - 1);
});

// ─── GATE ──────────────────────────────────────────
function loadBeacon() {
  if (!CF_BEACON_TOKEN || document.getElementById('cf-beacon')) return;
  const s = document.createElement('script');
  s.id = 'cf-beacon'; s.defer = true; s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
  s.setAttribute('data-cf-beacon', JSON.stringify({ token: CF_BEACON_TOKEN }));
  document.head.appendChild(s);
}
function unlock(code, instant) {
  const g = document.getElementById('gate');
  if (CODES[code].track) loadBeacon();
  if (instant) { g.classList.add('gone'); return; }
  const w = document.getElementById('gwelcome');
  document.getElementById('gcard').style.opacity = 0;
  w.textContent = CODES[code].welcome; w.classList.add('show');
  setTimeout(() => { g.classList.add('unlock'); setTimeout(() => g.classList.add('gone'), 520); }, 900);
}
document.getElementById('gform').addEventListener('submit', e => {
  e.preventDefault();
  const inp = document.getElementById('gin'), code = inp.value.trim().toUpperCase();
  if (CODES[code]) {
    try { sessionStorage.setItem('aw-code', code); } catch (_) {}
    unlock(code);
  } else {
    inp.classList.remove('err'); void inp.offsetWidth; inp.classList.add('err');
    document.getElementById('gerr').textContent = 'That code doesn’t work. Check the application for the code.';
  }
});

// ─── INIT ──────────────────────────────────────────
try { const th = localStorage.getItem('aw-theme'); if (th) document.documentElement.dataset.theme = th; } catch (_) {}
setScene(1);
try { const c = sessionStorage.getItem('aw-code'); if (c && CODES[c]) unlock(c, true); } catch (_) {}
if (!document.getElementById('gate').classList.contains('gone')) document.getElementById('gin').focus();
</script>
